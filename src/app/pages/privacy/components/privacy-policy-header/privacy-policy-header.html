<section class="group" [attr.aria-labelledby]="id">

    <span class="flex items-center justify-center w-8 h-8 bg-linear-to-br from-orange-500 to-yellow-500 text-white text-sm font-bold rounded-lg">
      {{ number }}
    </span>

    {{ title }}
  </h2>

  <div class="pr-11">
    <ng-content />
  </div>
</section>

<div class="group p-6 bg-[#161616] rounded-2xl border border-[#262626] hover:border-orange-500/30 transition-all duration-300 text-center relative overflow-hidden">
  <div [class]="'absolute inset-0 bg-linear-to-br ' + value.gradient + ' opacity-0 group-hover:opacity-10 transition-opacity duration-300'"></div>
  <div class="relative">
    <i [class]="value.icon + ' text-4xl text-orange-500 mb-4 block'"></i>
    <h3 class="text-lg font-bold text-white mb-2 group-hover:text-orange-500 transition-colors">{{ value.title }}</h3>
    <p class="text-neutral-400 text-sm">{{ value.description }}</p>
  </div>
</div>
